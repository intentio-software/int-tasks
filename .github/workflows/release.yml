name: Release

on:
  push:
    branches: [main]

jobs:
  # The gate, and the reason this workflow is no longer just a tagger.
  # Everything in `release` cuts a tag, bumps the version and dispatches the
  # build; a suite that only ran afterwards could not stop a release it had
  # already missed, which is how two versions came to exist with no binaries
  # behind them. A red suite now means no tag at all.
  #
  # macOS, because the whole workspace compiles there with no apt packages:
  # src-tauri links against webkit and GTK on Linux, and those 28 assertions
  # (the nudge rules, the busylight) are worth gating on.
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      # .nvmrc is the single source of truth, and package.json carries the same
      # floor as `engines`, so npm ci refuses outright on a Node too old rather
      # than failing later as a puzzling jsdom crash.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # The Rust side is a cargo workspace rooted at the repo, not at src-tauri.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: npm run test:web

      - run: cargo test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Record latest tag before release
        id: pre
        run: |
          git fetch --tags
          echo "tag=$(git tag --sort=-v:refname | head -1)" >> $GITHUB_OUTPUT

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Trigger build if new release was created
        run: |
          git fetch --tags
          NEW_TAG=$(git tag --sort=-v:refname | head -1)
          if [ "$NEW_TAG" != "${{ steps.pre.outputs.tag }}" ] && [ -n "$NEW_TAG" ]; then
            echo "New release: $NEW_TAG — triggering build"
            gh api repos/${{ github.repository }}/dispatches \
              --method POST \
              -f event_type=tauri-build \
              -f "client_payload[tag]=$NEW_TAG"
          else
            echo "No new release, skipping build."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
