name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # The gate, and the reason this job is no longer just a tagger. Everything
      # below cuts a tag, bumps the version and dispatches the build; a suite
      # that only ran afterwards could not stop any of it, which is how two
      # versions came to exist with nothing behind them. A red suite now means
      # no tag at all.
      #
      # Only the two pure crates: they need no webkit, no GTK and no signing, so
      # they cost seconds here. src-tauri is tested in the build, where the
      # system libraries it links against are already installed.
      - name: Test
        run: |
          npm run test:web
          cargo test -p int-tasks-core -p int-tasks-mcp

      - name: Record latest tag before release
        id: pre
        run: |
          git fetch --tags
          echo "tag=$(git tag --sort=-v:refname | head -1)" >> $GITHUB_OUTPUT

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Trigger build if new release was created
        run: |
          git fetch --tags
          NEW_TAG=$(git tag --sort=-v:refname | head -1)
          if [ "$NEW_TAG" != "${{ steps.pre.outputs.tag }}" ] && [ -n "$NEW_TAG" ]; then
            echo "New release: $NEW_TAG — triggering build"
            gh api repos/${{ github.repository }}/dispatches \
              --method POST \
              -f event_type=tauri-build \
              -f "client_payload[tag]=$NEW_TAG"
          else
            echo "No new release, skipping build."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
