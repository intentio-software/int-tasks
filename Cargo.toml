[workspace]
resolver = "2"
members = ["crates/int-tasks-core", "crates/int-tasks-mcp", "src-tauri"]

[workspace.package]
version = "1.15.0"
edition = "2021"
authors = ["Intentio Software"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
opt-level = "z"
lto = true
